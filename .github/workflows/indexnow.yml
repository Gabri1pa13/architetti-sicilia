name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/indexnow-ping.py
